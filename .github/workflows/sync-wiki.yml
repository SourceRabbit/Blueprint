name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - '.wiki/**'
      - '.github/scripts/PrepareWiki.ps1'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out documentation
        uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false

      - name: Check out Wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          ref: master
          path: wiki

      - name: Prepare Wiki pages and links
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: ./source/.github/scripts/PrepareWiki.ps1 -sourceDirectory ./source/.wiki -destinationDirectory ./wiki -repository $env:REPOSITORY -sourceBranch main

      - name: Publish changed pages
        shell: pwsh
        working-directory: wiki
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (@(git status --porcelain).Count -eq 0)
          {
              Write-Output 'Wiki is already up to date.'
              exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Sync documentation from $env:SOURCE_SHA"
          git push origin HEAD:master
